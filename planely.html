<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planly - Live Dashboard (Full 15 Sprints)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0f1115; color: #e2e8f0; padding: 40px; display: flex; justify-content: center; }
        .container { max-width: 1100px; width: 100%; }
        h1 { font-size: 1.8rem; font-weight: 600; margin-bottom: 30px; }
        .top-controls { display: flex; gap: 60px; margin-bottom: 40px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; flex: 1; max-width: 400px; }
        .input-label { font-size: 0.9rem; font-weight: 500; }
        .text-input-wrapper { background-color: #16181d; border: 1px solid #2d333b; border-radius: 8px; display: flex; align-items: center; padding: 0 16px; }
        .text-input { background: transparent; border: none; color: white; padding: 12px 0; width: 100%; font-size: 1rem; outline: none; }
        .date-selector { display: flex; gap: 10px; margin-top: 8px; }
        .date-pill { padding: 10px 20px; border-radius: 20px; background-color: transparent; border: 1px solid #2d333b; color: #8b949e; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
        .date-pill.active { background-color: #21262d; color: white; border-color: #30363d; }
        .date-pill:hover:not(.active) { border-color: #8b949e; color: white; }
        h2 { font-size: 1.2rem; font-weight: 500; margin-bottom: 16px; }
        .sprints-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 16px; scrollbar-width: none; }
        .sprints-nav::-webkit-scrollbar { display: none; }
        .sprint-tab { padding: 8px 16px; border-radius: 8px; background-color: transparent; border: 1px solid transparent; color: #8b949e; cursor: pointer; font-size: 0.95rem; white-space: nowrap; }
        .sprint-tab.active { background-color: #21262d; color: white; border-color: #30363d; }
        .sprint-tab:hover:not(.active) { background-color: #16181d; color: white; }
        .content-grid { display: flex; gap: 30px; align-items: flex-start; }
        .days-list { flex: 1; display: flex; flex-direction: column; gap: 12px; }
        .day-row-container { background-color: #16181d; border-radius: 12px; overflow: hidden; border: 1px solid transparent; transition: border-color 0.2s; }
        .day-row-container.open { border-color: #2d333b; }
        .day-row { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background-color 0.2s; }
        .day-row:hover { background-color: #1c2128; }
        .day-left { display: flex; align-items: center; gap: 16px; }
        .day-number { color: #e2e8f0; font-size: 0.95rem; font-weight: 500; min-width: 50px; }
        .day-subject { color: #8b949e; font-size: 0.95rem; }
        .day-right { display: flex; align-items: center; gap: 16px; }
        .day-time { color: #8b949e; font-size: 0.9rem; }
        .chevron { color: #8b949e; font-size: 1.2rem; transition: transform 0.3s ease; }
        .day-row-container.open .chevron { transform: rotate(90deg); }
        .topics-container { display: none; padding: 0 20px 16px 20px; background-color: #1c2128; border-top: 1px solid #2d333b; }
        .day-row-container.open .topics-container { display: block; }
        .topic-label { display: flex; align-items: center; gap: 12px; padding: 12px 0; color: #c9d1d9; font-size: 0.95rem; border-bottom: 1px solid #2d333b; cursor: pointer; }
        .topic-label:last-child { border-bottom: none; }
        .topic-label input[type="checkbox"] { width: 18px; height: 18px; accent-color: #2ea043; cursor: pointer; }
        .completed-text { text-decoration: line-through; color: #8b949e; opacity: 0.7; }
        .stats-box { width: 320px; background-color: #16181d; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 20px; position: sticky; top: 40px; border: 1px solid #2d333b;}
        .stat-item { display: flex; justify-content: space-between; color: #8b949e; font-size: 0.9rem; }
        .stat-value { color: white; font-weight: 500; }
        .stat-divider { height: 1px; background-color: #2d333b; width: 100%; }
        .progress-section { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
        .progress-header { display: flex; justify-content: space-between; font-size: 0.95rem; font-weight: 600; color: #fff;}
        .progress-bar-bg { width: 100%; height: 10px; background-color: #2d333b; border-radius: 5px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background-color: #2ea043; width: 0%; transition: width 0.4s ease; }
        .highlight { color: #2ea043; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>

        let appState = {}; 
        let totalGlobalTopics = 0;
        let totalGlobalDays = 0;

        function init() {
            for (const sprint in rawSprintData) {
                appState[sprint] = [];
                rawSprintData[sprint].forEach(dayItem => {
                    totalGlobalDays++;
                    const newTopics = dayItem.topics.map(t => {
                        totalGlobalTopics++;
                        return { name: t, completed: false };
                    });
                    appState[sprint].push({ ...dayItem, topics: newTopics });
                });
            }

            renderSprintTabs();
            loadSprint(1); 
            updateLiveDashboard();
            
            document.querySelectorAll('.date-pill').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.date-pill').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        }

        function renderSprintTabs() {
            const nav = document.getElementById('sprints-nav');
            for(let i = 1; i <= 15; i++) {
                const tab = document.createElement('button');
                tab.className = `sprint-tab ${i === 1 ? 'active' : ''}`;
                tab.id = `tab-${i}`;
                tab.innerText = `Sprint ${i}`;
                tab.onclick = () => loadSprint(i);
                nav.appendChild(tab);
            }
        }

        function loadSprint(sprintNum) {
            document.querySelectorAll('.sprint-tab').forEach(t => t.classList.remove('active'));
            const activeTab = document.getElementById(`tab-${sprintNum}`);
            if(activeTab) {
                activeTab.classList.add('active');
                activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }

            const list = document.getElementById('days-list');
            list.innerHTML = '';

            const daysData = appState[sprintNum];
            if(!daysData) return;

            daysData.forEach((item, dIndex) => {
                let topicsHTML = '';
                item.topics.forEach((topicObj, tIndex) => {
                    topicsHTML += `
                        <label class="topic-label">
                            <input type="checkbox" ${topicObj.completed ? 'checked' : ''} onchange="toggleTopic(this, ${sprintNum}, ${dIndex}, ${tIndex})">
                            <span class="${topicObj.completed ? 'completed-text' : ''}">${topicObj.name}</span>
                        </label>
                    `;
                });

                const container = document.createElement('div');
                container.className = 'day-row-container';
                container.innerHTML = `
                    <div class="day-row" onclick="toggleAccordion(this)">
                        <div class="day-left">
                            <span class="day-number">Day ${item.day}</span>
                            <span class="day-subject">${item.subject}</span>
                        </div>
                        <div class="day-right">
                            <span class="day-time">Est. ${item.time}</span>
                            <span class="chevron">›</span>
                        </div>
                    </div>
                    <div class="topics-container" onclick="event.stopPropagation()">
                        ${topicsHTML}
                    </div>
                `;
                list.appendChild(container);
            });
        }

        function toggleAccordion(element) {
            const container = element.parentElement;
            container.classList.toggle('open');
        }

        function toggleTopic(checkboxElement, sprintNum, dayIndex, topicIndex) {
            appState[sprintNum][dayIndex].topics[topicIndex].completed = checkboxElement.checked;
            const textSpan = checkboxElement.nextElementSibling;
            if(checkboxElement.checked) textSpan.classList.add('completed-text');
            else textSpan.classList.remove('completed-text');
            updateLiveDashboard();
        }

        function updateLiveDashboard() {
            let completedTopics = 0;
            let completedDays = 0;

            for (const sprint in appState) {
                appState[sprint].forEach(dayItem => {
                    let allTopicsInDayDone = true;
                    dayItem.topics.forEach(t => {
                        if(t.completed) completedTopics++;
                        else allTopicsInDayDone = false;
                    });
                    if(allTopicsInDayDone && dayItem.topics.length > 0) completedDays++;
                });
            }

            document.getElementById('completed-topics').innerText = completedTopics;
            document.getElementById('total-topics').innerText = totalGlobalTopics;
            document.getElementById('days-remaining').innerText = totalGlobalDays - completedDays;

            let progressPercent = totalGlobalTopics === 0 ? 0 : Math.round((completedTopics / totalGlobalTopics) * 100);
            document.getElementById('progress-fill').style.width = `${progressPercent}%`;
            document.getElementById('progress-text').innerText = `${progressPercent}%`;
        }

        window.onload = init;
    </script>
</body>
</html>
